<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Used for slide/document conversion on Linux (this machine, the GitHub Action). Decks name Windows/Mac fonts that
     are not installed; each is mapped to a free font of the same width so text keeps its layout. Fonts not listed fall
     back to Liberation Sans (Arial widths) rather than a wide face. tools/sorter/install_fonts.py installs the free fonts
     and a working "Symbol"; Debian packages: see its docstring. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="pattern"><test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Liberation Sans</string></edit></match>
  <match target="pattern"><test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Liberation Serif</string></edit></match>
  <alias binding="same"><family>Wingdings</family><prefer><family>Wingdings</family></prefer></alias>
  <alias binding="same"><family>Gill Sans MT</family><prefer><family>Gillius ADF</family></prefer></alias>
  <alias binding="same"><family>GillSansMT</family><prefer><family>Gillius ADF</family></prefer></alias>
