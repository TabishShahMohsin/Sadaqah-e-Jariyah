<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Used for slide/document conversion on Linux (the GitHub Action). Lecture decks name Windows fonts that
     aren't installed there; without these stand-ins bullets turn into empty boxes and wide fallback fonts
     push titles into the body text. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir>/usr/share/wine/fonts</dir>
  <alias binding="same"><family>Wingdings</family><prefer><family>Wingdings</family></prefer></alias>
  <alias binding="same"><family>Gill Sans MT</family><prefer><family>Gillius ADF</family></prefer></alias>
  <alias binding="same"><family>GillSansMT</family><prefer><family>Gillius ADF</family></prefer></alias>
  <alias binding="same"><family>Gill Sans</family><prefer><family>Gillius ADF</family></prefer></alias>
  <alias binding="same"><family>Gill Sans MT Condensed</family><prefer><family>Gillius ADF Cond</family></prefer></alias>
  <alias binding="same"><family>Rockwell Condensed</family><prefer><family>Nimbus Sans Narrow</family></prefer></alias>
  <alias binding="same"><family>Rockwell</family><prefer><family>Roboto Slab</family></prefer></alias>
  <alias binding="same"><family>Arial Narrow</family><prefer><family>Liberation Sans Narrow</family><family>Nimbus Sans Narrow</family></prefer></alias>
  <alias binding="same"><family>Calibri Light</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="same"><family>Cambria Math</family><prefer><family>Caladea</family></prefer></alias>
  <alias binding="same"><family>Century Gothic</family><prefer><family>URW Gothic</family><family>TeX Gyre Adventor</family></prefer></alias>
  <alias binding="same"><family>Tw Cen MT</family><prefer><family>Gillius ADF Cond</family></prefer></alias>
  <alias binding="same"><family>Segoe UI</family><prefer><family>Open Sans</family><family>Noto Sans</family></prefer></alias>
  <alias binding="same"><family>Tahoma</family><prefer><family>DejaVu Sans Condensed</family></prefer></alias>
  <alias binding="same"><family>Verdana</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Book Antiqua</family><prefer><family>TeX Gyre Pagella</family><family>URW Palladio</family></prefer></alias>
  <alias binding="same"><family>Palatino Linotype</family><prefer><family>TeX Gyre Pagella</family><family>URW Palladio</family></prefer></alias>
  <alias binding="same"><family>Garamond</family><prefer><family>EB Garamond</family></prefer></alias>
  <alias binding="same"><family>Franklin Gothic Medium</family><prefer><family>Libre Franklin</family></prefer></alias>
  <alias binding="same"><family>-apple-system</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>PMingLiU</family><prefer><family>Noto Serif CJK TC</family></prefer></alias>
  <alias binding="same"><family>新細明體</family><prefer><family>Noto Serif CJK TC</family></prefer></alias>
  <alias binding="same"><family>MS PGothic</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="same"><family>ＭＳ Ｐゴシック</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
</fontconfig>
