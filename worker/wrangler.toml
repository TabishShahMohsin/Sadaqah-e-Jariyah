# Sadaqah-e-Jariyah contribution intake — see DEPLOY.md
name = "sej-intake"
main = "src/index.js"
compatibility_date = "2025-06-01"

# The API lives at intake.sej.org.in (a custom domain on the sej.org.in zone).
routes = [{ pattern = "intake.sej.org.in", custom_domain = true }]

# Runs every 30 minutes: clears abandoned uploads, retries GitHub issues that failed to open.
[triggers]
crons = ["*/30 * * * *"]

[vars]
# Sites allowed to call this API (comma-separated).
ALLOWED_ORIGINS = "https://sej.org.in,https://www.sej.org.in,https://staging.sej.org.in,https://sadaqah-e-jariyah.pages.dev,https://staging.sadaqah-e-jariyah.pages.dev,http://localhost:8000"
GITHUB_REPO = "TabishShahMohsin/Sadaqah-e-Jariyah"   # issues notify the maintainer (optional: needs GITHUB_TOKEN)
PUBLIC_REPO = "false"   # the repo is private: contributors never get links into it
LIMIT_PER_HOUR = "15"   # per IP; a hostel or campus network shares one
LIMIT_PER_DAY = "50"
LIMIT_GLOBAL_PER_DAY = "300"
LIMIT_GLOBAL_BYTES_PER_DAY = "40000000000"

# Secrets (set with `npx wrangler secret put NAME`, never in this file):
#   TURNSTILE_SECRET   from Cloudflare Turnstile
#   GITHUB_TOKEN       optional: fine-grained token, this repo only, Issues read/write (opens an issue per contribution)
#   ADMIN_TOKEN        long random string; tools/intake.py reads it from catalog/intake-config.json

# File uploads need an R2 bucket (paid activation on Cloudflare), so the intake takes links only.
# To take files too: enable R2, create a private bucket sej-inbox, and uncomment:
# [[r2_buckets]]
# binding = "INBOX"
# bucket_name = "sej-inbox"        # PRIVATE bucket — never enable public access on it

[[d1_databases]]
binding = "DB"
database_name = "sej-intake"
database_id = "32c99413-daec-4e6b-aecf-9fdeb8770b31"
