<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sadaqah-e-Jariyah</title>
<meta name="description" content="Notes, past papers, syllabi and lab work for B.Tech at AMU — free and open.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="brand/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<meta property="og:title" content="Sadaqah-e-Jariyah">
<meta property="og:description" content="Notes, past papers, syllabi and lab work for B.Tech at AMU.">
<meta property="og:image" content="https://sadaqah-e-jariyah.pages.dev/brand/social-preview.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preload" href="fonts/outfit.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="bar">
  <button class="icon-btn back-btn" id="backBtn" type="button" title="Back" hidden>←</button>
  <a class="brand" href="#/" aria-label="Home"><img class="mark" src="brand/logo.svg" alt="" width="27" height="26"><span class="brand-text">SADAQAH-E-JARIYAH</span></a>
  <nav id="crumbs" aria-label="Breadcrumb"></nav>
  <a class="contrib-btn" href="#/contribute"><span class="plus">+</span><span class="contrib-text">Contribute</span></a>
  <button class="search-btn" id="searchBtn" type="button"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Search</span><kbd id="kbdHint">⌘K</kbd></button>
</header>

<main id="view"><div class="loading"><span class="spinner"></span> Loading index…</div></main>

<footer class="foot">
  <div><span class="pulse"></span> <span id="footStatus">—</span> · <a href="#/credits">Sources &amp; credits</a> · <a href="https://huggingface.co/datasets/TabishShahMohsin/sej-files" target="_blank" rel="noopener">Download everything</a></div>
  <div class="foot-quote">“The humblest branch of faith is removing an obstacle from a path.”</div>
</footer>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" inert aria-hidden="true" aria-label="File preview">
  <div class="dr-head">
    <div class="dr-title">
      <span class="ext" id="drExt"></span>
      <div class="dr-text"><div class="dr-name" id="drName"></div><div class="dr-path" id="drPath"></div><div class="dr-by" id="drBy" hidden></div></div>
    </div>
    <div class="dr-actions">
      <button class="icon-btn" id="prevBtn" title="Previous (←)" type="button">←</button>
      <span class="dr-pos" id="drPos"></span>
      <button class="icon-btn" id="nextBtn" title="Next (→)" type="button">→</button>
      <a class="pill-btn" id="openBtn" target="_blank" rel="noopener">Open ↗</a>
      <a class="pill-btn solid" id="dlBtn" download>Download</a>
      <button class="icon-btn" id="closeBtn" title="Close (Esc)" type="button">✕</button>
    </div>
  </div>
  <div class="dr-body" id="drBody"></div>
</aside>

<div class="palette" id="palette" hidden>
  <div class="pal-box" role="dialog" aria-label="Search">
    <label class="pal-input">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="Search courses, notes, PYQs…" autocomplete="off" spellcheck="false">
      <kbd>esc</kbd>
    </label>
    <div class="pal-results" id="results"></div>
    <div class="pal-foot"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>↵</kbd> open</span><span class="pal-tip">try “sem-end 2023 maths” or “dbms unit 2”</span></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
