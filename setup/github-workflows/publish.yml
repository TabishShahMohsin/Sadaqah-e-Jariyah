# After a merge to main: copy approved files to the public bucket, rebuild the index, deploy the site.
name: Publish

on:
  push:
    branches: [main]
    paths: ["catalog/**", "site/**", "tools/**", "CONVENTIONS.md"]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - name: Check catalog
        run: python tools/sej.py check
      - name: Publish files and build index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INTAKE_API: ${{ vars.INTAKE_API }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          INBOX_BUCKET: sej-inbox
          FILES_BUCKET: sej-files
          FILES_BASE_URL: ${{ vars.FILES_BASE_URL }}
          TURNSTILE_SITEKEY: ${{ vars.TURNSTILE_SITEKEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python tools/publish.py
      - name: Deploy site
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.20.0"
          command: pages deploy site --project-name=sej --branch=main --commit-dirty=true
